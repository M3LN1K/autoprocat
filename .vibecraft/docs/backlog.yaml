version: 1
tasks:
  - id: task-0653
    title: Главная страница
    description: >-
      Создать главную страницу сайта автопроката со статическими
      данными-заглушками.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      Состав: полноэкранный hero-баннер с крупным автомобилем и кнопкой
      «Забронировать», блок преимуществ (страховка, подача за 15 минут,
      прозрачные цены), горизонтальный слайдер с 3–4 популярными моделями авто,
      краткий блок «О нас» и CTA-блок внизу.

      Визуальный стиль: тёмная тема для hero-секции, светлая — для контентных
      блоков; глубокий тёмно-синий + белый + акцентный оранжевый/янтарный;
      современный гротеск, крупные заголовки, много воздуха.

      Изображения: если генерация фото недоступна — области с серым фоном и
      подписью «Место для фото [название авто]», без битых ссылок на внешние
      картинки.
    status: completed
    acceptance_criteria:
      - Hero-баннер на весь экран с кнопкой «Забронировать»
      - "Блок преимуществ с тремя пунктами: страховка, подача за 15 минут,
        прозрачные цены"
      - Горизонтальный слайдер с 3–4 популярными моделями авто
      - Краткий блок «О нас» и CTA-блок внизу страницы
    summary: >-
      Главная страница автопроката реализована: полноэкранный hero-баннер в
      тёмно-синей теме с кнопкой «Забронировать», блок преимуществ (страховка,
      подача за 15 минут, прозрачные цены), горизонтальный слайдер с 4
      популярными моделями авто, блок «О нас» и CTA-блок внизу. Фото заменены
      заглушками «Место для фото …». Основная реализация — app/page.tsx и
      компоненты components/*-section.tsx, данные — lib/data.ts.
  - id: task-0125
    title: Sticky-навигация и подвал
    description: >-
      Создать общие элементы сайта: закреплённую сверху (sticky) навигацию со
      ссылками на все страницы (Главная, Услуги, Каталог, О нас, Контакты,
      Политика) и логотипом компании, мобильное меню, а также подвал с
      контактами и ссылками.

      Навигация должна работать на всех страницах сайта.
    status: completed
    acceptance_criteria:
      - Навигация закреплена сверху и видна при прокрутке на всех страницах
      - На мобильных устройствах навигация открывается через меню
      - Подвал содержит контакты компании и ссылки на страницы
    summary: >-
      Sticky-навигация и подвал реализованы. Навигация закреплена сверху
      (sticky) и содержит логотип компании и ссылки на все страницы (Главная,
      Услуги, Каталог, О нас, Контакты, Политика); на мобильных экранах
      открывается через выдвижное меню с кнопкой-бургером. Подвал содержит
      контакты компании, ссылки на разделы и копирайт. Основная реализация —
      components/site-header.tsx и components/site-footer.tsx, общие данные —
      lib/data.ts, подключение в app/layout.tsx. Для работы навигации добавлены
      страницы-заглушки для всех разделов.
